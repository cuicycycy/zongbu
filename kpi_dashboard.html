<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总部 KPI 达成看板</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --ink:#1f2d3d; --sub:#67748a; --line:#e6ebf2;
    --green:#1e9e5a; --yellow:#e3a008; --red:#d8392b; --blue:#2f6fed; --blue2:#eaf1ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .wrap{margin:0 auto;padding:14px 18px}
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);padding-top:14px;padding-bottom:8px;
          border-bottom:1px solid var(--line);box-shadow:0 4px 10px rgba(0,0,0,.04)}
  header{background:linear-gradient(135deg,#2f6fed,#1b4fd1);color:#fff;border-radius:14px;
         padding:14px 20px;box-shadow:0 6px 18px rgba(47,111,237,.25)}
  header h1{margin:0;font-size:20px;font-weight:700}
  header .sub{font-size:12.5px;opacity:.9;margin-top:3px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 2px}
  #monthSel{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:14px;background:#fff;outline:none}
  #monthSel:focus{border-color:var(--blue)}
  .tbtn{padding:0 14px;height:42px;border:1px solid var(--line);background:#fff;color:var(--sub);
        border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
  .tbtn:hover{border-color:var(--blue);color:var(--blue)}
  .toolbar .meta{font-size:12.5px;color:var(--sub);margin-left:auto}
  .qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 2px}
  #qInput{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;
          background:#fff;outline:none;min-width:280px;flex:0 1 320px}
  #qInput:focus{border-color:var(--blue)}
  .qhint{font-size:12.5px;color:var(--sub);font-weight:600}
  .qbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .qbtn{height:34px;border:1px solid var(--line);border-radius:18px;padding:0 14px;font-size:13px;
        font-weight:600;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}
  .qbtn:hover{border-color:var(--blue);color:var(--blue)}
  .qbtn.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .note-line{font-size:12.5px;color:var(--sub);background:#f0f4fb;border:1px solid var(--line);
             border-radius:10px;padding:9px 12px;margin:10px 0 4px;line-height:1.75}
  .note-line b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;
         cursor:pointer;transition:.15s;align-self:start}
  .pcard:hover{border-color:#b9cdf7;box-shadow:0 6px 18px rgba(47,111,237,.10)}
  .pcard.open{grid-column:1/-1;cursor:default;border-color:var(--blue);box-shadow:0 8px 24px rgba(47,111,237,.14)}
  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .pname{font-size:17px;font-weight:800}
  .pname .tag{font-size:11px;font-weight:600;color:var(--blue);background:var(--blue2);
              padding:2px 8px;border-radius:20px;margin-left:7px;vertical-align:middle}
  .pname .tag.gray{color:var(--sub);background:#eef1f6}
  .pscore{font-size:22px;font-weight:800;line-height:1}
  .pscore .u{font-size:13px;font-weight:700}
  .pmeta{font-size:11.5px;color:var(--sub);margin:4px 0 10px}
  .items{display:flex;flex-direction:column;gap:1px}
  .krow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;
        padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13px}
  .krow:last-child{border-bottom:none}
  .kname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kname .kw{font-size:11px;color:var(--sub);margin-left:5px}
  .kval{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:62px}
  .kst{font-size:11px;font-weight:600;padding:1px 8px;border-radius:20px;min-width:52px;text-align:center}
  .kst.green{background:#e8f6ee;color:var(--green)}
  .kst.red{background:#fdecea;color:var(--red)}
  .kst.gray{background:#eef1f6;color:var(--sub)}
  .g{color:var(--green)} .r{color:var(--red)} .y{color:var(--yellow)} .n{color:var(--sub)}
  .pexpand{font-size:11.5px;color:var(--blue);font-weight:600;text-align:right;margin-top:9px}
  .pdetail{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .pcard.open .pdetail{display:block}
  .dtitle{font-size:13px;font-weight:700;margin:2px 0 8px;display:flex;align-items:center;gap:7px}
  .dtitle:before{content:"";width:4px;height:14px;background:var(--blue);border-radius:3px}
  .trend{width:100%;height:150px;display:block}
  .tblwrap{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:12px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
  th,td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f0f4fb;color:var(--sub);font-weight:600;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:132px}
  thead th:first-child{background:#f0f4fb;z-index:3}
  tr:last-child td{border-bottom:none}
  .tdmiss{color:#b9c3d2}
  .fbk{font-size:10px;color:var(--yellow);font-weight:600;margin-left:3px;vertical-align:middle}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--sub)}
  footer{margin-top:26px;font-size:11.5px;color:var(--sub);text-align:center;line-height:1.7}
  @media(max-width:1180px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.wrap{padding:10px}.grid{grid-template-columns:1fr}.pscore{font-size:19px}header h1{font-size:18px}}
</style>
</head>

const MONTHS = KPI.months;
let CUR = KPI.monthCur;

function fmtMo(mo){ return mo.slice(5,7) + "月"; }
function fmtPct(x, d){ return x==null ? "—" : (x*100).toFixed(d==null?1:d) + "%"; }
function fmtCount(x){ if(x==null) return "—"; const r=Math.round(x*10)/10; return (r%1===0)?String(Math.round(x)):r.toFixed(1); }

function resolveMonth(rec, mo){
  if(rec.months[mo]) return {m:rec.months[mo], src:mo, fb:false};
  const cands = Object.keys(rec.months).filter(x=>x<mo).sort();
  if(cands.length){ const src=cands[cands.length-1]; return {m:rec.months[src], src:src, fb:true}; }
  return {m:null, src:null, fb:false};
}
function fmtCellVal(rec, m){
  if(rec.disp==="pct") return fmtPct(m.raw[0], 2);
  if(rec.disp==="cnt") return fmtCount(m.raw[0]) + (rec.unit || "例");
  if(rec.kind==="gold") return m.raw[0]+"/"+m.raw[1]+"（"+fmtPct(m.actual)+"）";
  if(rec.kind==="cost") return "达成率 "+fmtPct(m.actual);
  if(rec.kind==="ot_h"||rec.kind==="ot_l"){
    const u = rec.unit||"";
    if(rec.kind==="ot_l" && (rec.target===0||rec.target==null)) return m.raw[0]+"例（"+fmtPct(m.actual)+"）";
    return m.raw[0]+u+"/"+m.raw[1]+u+"（"+fmtPct(m.actual)+"）";
  }
  return fmtPct(m.actual);
}
function itemStatus(rec, mo){
  if(!rec.has) return {txt:"待补数据源", cls:"gray", val:"—", ok:null};
  const r = resolveMonth(rec, mo);
  if(!r.m) return {txt:"无数据", cls:"gray", val:"—", ok:null};
  const m=r.m, ok = m.coef >= 1 - 1e-9;
  let val;
  if(rec.disp==="pct") val = fmtPct(m.raw[0], 2);
  else if(rec.disp==="cnt") val = fmtCount(m.raw[0]) + (rec.unit || "例");
  else if(rec.kind==="gold") val = m.raw[0]+"/"+m.raw[1];
  else if(rec.kind==="ot_l" && (rec.target===0||rec.target==null)){
    val = (m.raw? (m.raw[0]+"例 ") : "") + "("+fmtPct(m.actual)+")";
  }
  else if(rec.kind==="ot_h"||rec.kind==="ot_l"){
    const u = rec.unit||"";
    const rt = (m.raw && m.raw.length>=2) ? (m.raw[0]+u+"/"+m.raw[1]+u+" ") : "";
    val = rt + "("+fmtPct(m.actual)+")";
  }
  else val = fmtPct(m.actual);
  return {txt: ok?"达标":"未达标", cls: ok?"green":"red", val:val, ok, actual:m.actual, raw:m.raw, src:r.src, fb:r.fb};
}

function scoreColor(s){
  if(s==null) return "n";
  if(s>=0.9) return "g";
  if(s>=0.75) return "y";
  return "r";
}

function renderCard(p, idx){
  const s = p.scoreByMonth[CUR];
  const scorePct = s ? s.score : null;
  const cov = p.weightCovered*100;
  const tot = p.weightTotal*100;
  const roleCls = p.scope==="none" ? "tag gray" : "tag";
  let rows = "";
  if(p.items.length===0){
    rows = '<div class="empty" style="padding:16px;border:none">暂无考核项</div>';
  } else {
    p.items.forEach(rec=>{
      const st = itemStatus(rec, CUR);
      const valCls = st.ok===true ? "g" : (st.ok===false ? "r" : "n");
      const fbTag = st.fb ? '<span class="fbk">用'+fmtMo(st.src)+'</span>' : '';
      rows += '<div class="krow">'+
        '<div class="kname">'+rec.name+'<span class="kw">'+(rec.weight*100)+'%</span></div>'+
        '<div class="kval '+valCls+'">'+st.val+fbTag+'</div>'+
        '<div class="kst '+st.cls+'">'+st.txt+'</div>'+
      '</div>';
    });
  }
  const card = document.createElement("div");
  card.className = "pcard";
  card.dataset.idx = idx;
  card.innerHTML =
    '<div class="phead">'+
      '<div class="pname">'+p.name+'<span class="'+roleCls+'">'+p.role+'</span></div>'+
      '<div class="pscore '+scoreColor(scorePct)+'">'+(scorePct==null?"—":(scorePct*100).toFixed(1)+'<span class="u">%</span>')+'</div>'+
    '</div>'+
    '<div class="pmeta">'+fmtMo(CUR)+' · 已覆盖 '+p.items.filter(x=>x.has).length+'/'+p.items.length+' 项（权重合计 '+cov.toFixed(0)+'%）</div>'+
    '<div class="items">'+rows+'</div>'+
    '<div class="pexpand">点击展开全部月及趋势 ▾</div>'+
    '<div class="pdetail"></div>';
  card.addEventListener("click", e=>{
    if(e.target.closest(".pdetail")) return;   // 展开区内部不收起
    card.classList.toggle("open");
    if(card.classList.contains("open")) fillDetail(card, p);
  });
  return card;
}

function svgTrend(p){
  const pts = MONTHS.map(mo=>{
    const s = p.scoreByMonth[mo];
    return {mo, v: s ? s.score : null};
  }).filter(x=>x.v!=null);
  if(pts.length===0) return '<div class="n" style="font-size:12px">暂无趋势数据</div>';
  const W=680, H=150, PL=44, PR=16, PT=18, PB=30;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vals = pts.map(x=>x.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  lo=Math.min(lo,0.6); hi=Math.max(hi,1.0);
  const pad=(hi-lo)*0.1||0.05; lo=Math.max(0,lo-pad); hi=Math.min(1.02,hi+pad);
  const x = i => PL + (pts.length===1?iw/2:(iw*i/(pts.length-1)));
  const y = v => PT + ih*(1-(v-lo)/(hi-lo));
  let grid="", lbl="";
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const v=lo+(hi-lo)*f, yy=y(v);
    grid+='<line x1="'+PL+'" y1="'+yy+'" x2="'+(W-PR)+'" y2="'+yy+'" stroke="#e6ebf2" stroke-width="1"/>';
    lbl+='<text x="'+(PL-6)+'" y="'+(yy+3.5)+'" text-anchor="end" font-size="10" fill="#98a4b6">'+(v*100).toFixed(0)+'%</text>';
  });
  let path="", dots="", xl="";
  pts.forEach((pt,i)=>{
    const px=x(i), py=y(pt.v);
    path += (i===0?"M":"L")+px.toFixed(1)+" "+py.toFixed(1)+" ";
    dots += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="4" fill="#2f6fed" stroke="#fff" stroke-width="2"/>'+
            '<text x="'+px.toFixed(1)+'" y="'+(py-9)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2d3d">'+(pt.v*100).toFixed(1)+'%</text>';
    xl += '<text x="'+px.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10.5" fill="#67748a">'+fmtMo(pt.mo)+'</text>';
  });
  return '<svg class="trend" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
    grid+lbl+
    '<path d="'+path+'" fill="none" stroke="#2f6fed" stroke-width="2.5" stroke-linejoin="round"/>'+
    dots+xl+'</svg>';
}

function fillDetail(card, p){
  const box = card.querySelector(".pdetail");
  if(box.dataset.done==="1") return;
  let head = '<tr><th>项目</th><th>权重</th><th>目标</th>';
  MONTHS.forEach(mo=> head += '<th>'+fmtMo(mo)+'</th>');
  head += '</tr>';
  let body="";
  p.items.forEach(rec=>{
    if(!rec.has){
      body += '<tr><td>'+rec.name+'</td><td>'+(rec.weight*100)+'%</td><td class="tdmiss">—</td>'+
              '<td class="tdmiss" colspan="'+MONTHS.length+'">待补数据源</td></tr>';
      return;
    }
    const firstKey = Object.keys(rec.months).sort()[0];
    const firstM = firstKey ? rec.months[firstKey] : null;
    let tgt = "—";
    if(rec.kind==="gold") tgt = "目标"+(firstM?firstM.raw[1]:"—");
    else if(rec.kind==="cost") tgt = "达成率=目标/实际";
    else if(rec.kind==="yoy") tgt = "目标同比下降"+Math.round((rec.target||0)*100)+"%";
    else if(rec.kind==="ot_h"||rec.kind==="ot_l"){
      if(rec.target===0||rec.target==null) tgt = "目标 0 例";
      else if(rec.unit) tgt = rec.target + rec.unit + "/月";
      else tgt = fmtPct(rec.target, (rec.target!=null && rec.target<1)?1:0);
    }
    else if(firstM) tgt = fmtPct(rec.target, (rec.target!=null && rec.target<1)?1:0);
    body += '<tr><td>'+rec.name+'</td><td>'+(rec.weight*100)+'%</td><td>'+tgt+'</td>';
    MONTHS.forEach(mo=>{
      const r = resolveMonth(rec, mo);
      if(!r.m){ body += '<td class="tdmiss">—</td>'; return; }
      const m=r.m, ok = m.coef>=1-1e-9;
      const cellTxt = fmtCellVal(rec, m);
      const fbt = r.fb ? '<span class="fbk">用'+fmtMo(r.src)+'</span>' : '';
      body += '<td class="'+(ok?"g":"r")+'">'+cellTxt+fbt+'</td>';
    });
    body += '</tr>';
  });
  // 综合达成率行
  body += '<tr><td><b>综合达成率</b></td><td><b>100%</b></td><td>—</td>';
  MONTHS.forEach(mo=>{
    const s=p.scoreByMonth[mo];
    body += '<td class="'+scoreColor(s?s.score:null)+'"><b>'+(s?(s.score*100).toFixed(1)+"%":"—")+'</b></td>';
  });
  body += '</tr>';
  box.innerHTML =
    '<div class="dtitle">综合达成率趋势</div>'+ svgTrend(p) +
    '<div class="dtitle" style="margin-top:14px">逐月明细（'+p.name+' · '+p.role+'）</div>'+
    '<div class="tblwrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  box.dataset.done="1";
}

function expandAll(open){
  document.querySelectorAll(".pcard").forEach(c=>{
    const p = KPI.people[+c.dataset.idx];
    if(open){ c.classList.add("open"); fillDetail(c,p); }
    else c.classList.remove("open");
  });
}

// 当前查询过滤结果（按权限过滤后的 people 列表）；默认空 = 不显示任何人
let curFiltered = [];

function renderGrid(){
  const g = document.getElementById("grid");
  g.innerHTML="";
  if(curFiltered.length===0){
    const msg = (document.getElementById("qHint").textContent || "").trim() || "请输入查询内容查看对应 KPI";
    g.innerHTML = '<div class="empty">'+msg+'</div>';
    return;
  }
  curFiltered.forEach(p=> g.appendChild(renderCard(p, KPI.people.indexOf(p))));
}

function doQuery(){
  const q = document.getElementById("qInput").value.trim();
  const hint = document.getElementById("qHint");
  // 高亮当前选中的按钮
  document.querySelectorAll(".qbtn").forEach(b=> b.classList.toggle("active", b.dataset.q===q));
  if(q===""){
    curFiltered = [];
    hint.textContent = "点击下面按钮，或输入查询内容查看对应 KPI";
    hint.style.color = "var(--sub)";
    renderGrid();
    return;
  }
  const names = (KPI.access && KPI.access[q]) || null;
  if(!names || names.length===0){
    curFiltered = [];
    hint.textContent = "未找到查询内容或无查看权限";
    hint.style.color = "var(--red)";
    renderGrid();
    return;
  }
  const visible = new Set(names);
  curFiltered = KPI.people.filter(p=> visible.has(p.name));
  hint.textContent = "查询「"+q+"」：显示 "+curFiltered.length+" 人";
  hint.style.color = "var(--green)";
  renderGrid();
}

function setMonth(mo){
  CUR = mo;
  renderGrid();
  document.getElementById("meta").textContent = "当前月份：" + fmtMo(mo) + "（" + mo + "）";
}

(function init(){
  const sel = document.getElementById("monthSel");
  MONTHS.forEach(mo=>{
    const o=document.createElement("option"); o.value=mo; o.textContent=fmtMo(mo)+"（"+mo+"）";
    if(mo===KPI.monthCur) o.selected=true; sel.appendChild(o);
  });
  const covered = KPI.people.reduce((a,p)=>a+(p.items.some(x=>x.has)?1:0),0);
  document.getElementById("foot").textContent = "数据源：基础指标数据源（月终版） · 口径与「区域自查业绩看板」一致 · 生成于本机";
  // 生成查询快捷按钮：总部(全部) + 各查询码
  const qBtns = document.getElementById("qBtns");
  const keys = Object.keys(KPI.access || {});
  const order = [];
  if(keys.includes("总部")) order.push("总部");
  keys.filter(k=> k!=="总部" && k!=="全部" && k!=="all").forEach(k=> order.push(k));
  order.forEach(k=>{
    const b=document.createElement("button");
    b.className="qbtn"; b.dataset.q=k;
    b.textContent = (k==="总部") ? "总部（全部）" : k;
    b.onclick = ()=>{ document.getElementById("qInput").value=k; doQuery(); };
    qBtns.appendChild(b);
  });
  setMonth(KPI.monthCur);
})();
</script>
</body>
